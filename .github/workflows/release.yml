name: Release

# Push a tag like v0.2.0 to build installers for every platform and attach
# them to a draft GitHub release, which can then be reviewed and published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Create the draft once, up front. When every build job created it on its
  # own, two of them could race and split the installers over two drafts.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          tag="${TAG:-v$(node -p "require('./package.json').version")}"
          # Reuse an existing release for this tag, e.g. when re-running.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" \
              -f name="GitGud $tag" \
              -f body="See the assets below to download GitGud for your platform." \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distros
            args: ''
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app checks them against the public
          # key in tauri.conf.json before installing an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}
          # Adds latest.json to the release, which installed apps read to
          # find updates (see plugins.updater in tauri.conf.json).
          includeUpdaterJson: true
