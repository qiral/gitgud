name: Parity lab

# The backend and the real git binary, read against each other on the same
# scratch repository. Opt-in: every test in it is #[ignore]d, so the per-push
# gate stays fast and this runs when someone asks for it. See docs/TESTING.md.
on:
  workflow_dispatch:
  push:
    branches: ["parity/**"]
  schedule:
    # A quiet hour, so a red run is waiting with the morning coffee.
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  parity:
    name: parity (ubuntu)
    runs-on: ubuntu-latest
    # Comfortably above a cold build; a run that needs longer is stuck.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The test links the app's own library, so the Tauri Linux build
      # dependencies are needed even though nothing here touches the frontend.
      # Same package list as the check job in ci.yml.
      - name: Install Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Parity tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test parity -- --ignored
